<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Costa Vista is an original open-world crime game for the browser, set in a sun-soaked coastal city of fast cars, harbor jobs and five-star trouble.">
<title>Costa Vista</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1418; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Costa Vista, an original open-world crime game set in a sunlit coastal city. Drive, shoot, run jobs for Rudy's garage and outrun the Palma Syndicate. WASD moves, the mouse aims, left mouse shoots, E enters or exits a vehicle, F steals an occupied car, Space is the handbrake, Escape pauses and M mutes."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
